[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-sdk"
version = "0.1.0"
description = "Replay one user-journey step while agents code, then verify branches and full flows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
journey = "journeysdk.cli:main"

[tool.setuptools.packages.find]
include = ["journeysdk*"]
exclude = ["tests*", "output*", "journey_cloud*"]

[tool.setuptools.package-data]
journeysdk = ["py.typed"]
"journeysdk.agent_templates" = ["instructions.md"]
"journeysdk.touchpoint_docs" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
